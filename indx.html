/* Tap handling is GEOMETRY-based (no reliance on e.target / closest() inside transformed SVG groups, which differs across Safari/iPad). We convert the pointer position to map coordinates using the current zoom state (K, T) and hit-test markers, cities and the Saudi polygon ourselves. */
function onTap(el,fn,label){
 let s=null,last=0;
 const run=e=>{try{fn(e)}catch(x){fatal("\u062e\u0637\u0623 \u0641\u064a "+label+": "+x.message,x)}};
 el.addEventListener("pointerdown",e=>{s={x:e.clientX,y:e.clientY,t:Date.now()}},true);
 el.addEventListener("pointerup",e=>{if(!s)return;const m=Math.hypot(e.clientX-s.x,e.clientY-s.y),dt=Date.now()-s.t;s=null;if(m<8&&dt<700){last=Date.now();run(e)}},true);
 el.addEventListener("click",e=>{if(Date.now()-last>700)run(e)},true);
}
function bindTap(){onTap($("map"),tap,"\u0627\u0644\u0646\u0642\u0631 \u0639\u0644\u0649 \u0627\u0644\u062e\u0631\u064a\u0637\u0629")}
function inRing(r,x,y){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function inFeat(f,x,y){const g=f.geometry||f,P=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];return P.some(p=>inRing(p[0],x,y)&&!p.slice(1).some(h=>inRing(h,x,y)))}
function inSau(x,y){return !!sau&&inFeat(sau,x,y)}
function tap(e){
 const r=svg.node().getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,sx=p=>p[0]*K+T[0],sy=p=>p[1]*K+T[1];
 let best=null,bd=24;
 mk.selectAll("g.m").each(function(d){const dd=Math.hypot(sx(d._p)-px,sy(d._p)-py);if(dd<bd){bd=dd;best=[d,this]}});
 if(best){card(best[0],best[1]);return}
 $("card").style.display="none";
 if(mode==="saudi"){
  const gh=window.geoHit&&geoHit(px,py);if(gh){openForm({lat:gh.lat,lng:gh.lng,place:gh.place,sel:""});return}
  let c0=null,cd=22;CITIES.forEach(c=>{const dd=Math.hypot(sx(c._p)-px,sy(c._p)-py);if(dd<cd){cd=dd;c0=c}});
  if(c0){openForm({lat:c0[1],lng:c0[2],place:c0[0],sel:c0[0]});return}
 }
 const ll=map.projection.invert([(px-T[0])/K,(py-T[1])/K]),hit=!!ll&&inSau(ll[0],ll[1]);
 if(mode==="world"){
  const q=d3.geo.path().projection(map.projection).centroid(sau);
  if(hit||Math.hypot(sx(q)-px,sy(q)-py)<14)enter();
  return;
 }
 if(hit)openForm({lat:ll[1],lng:ll[0],place:((window.geoRegion&&geoRegion(ll[0],ll[1]))||"")+"\u0642\u0631\u0628 "+nearest(ll[1],ll[0]),sel:""});
}
function scale(){
 cityG.selectAll("g.c").attr("transform",c=>"translate("+c._p+")scale("+1/K+")");
 mk.selectAll("g.m").attr("transform",d=>"translate("+d._p+")scale("+1/K+")");
}
function fly(x,y,k){svg.transition().duration(2400).ease("cubic-in-out").call(zoom.translate([W/2-x*k,H*.48-y*k]).scale(k).event)}
function enter(){
 mode="saudi";
 const b=d3.geo.path().projection(map.projection).bounds(sau),dx=b[1][0]-b[0][0],dy=b[1][1]-b[0][1];
 saudiK=Math.min(60,.78/Math.max(dx/W,dy/(H*.8)));
 cityG.style("display",null).style("opacity",0).transition().delay(1400).duration(1000).style("opacity",1);
 fly((b[0][0]+b[1][0])/2,(b[0][1]+b[1][1])/2,saudiK);
 $("back").style.display="";window.geoShow&&geoShow(true);$("chips").style.display="flex";
}
function world(){
 mode="world";$("card").style.display="none";
 svg.transition().duration(2000).ease("cubic-in-out").call(zoom.translate([0,0]).scale(1).event);
 cityG.transition().duration(500).style("opacity",0).each("end",()=>cityG.style("display","none"));
 window.geoShow&&geoShow(false);$("back").style.display="none";$("chips").style.display="none";
}
function flyCity(c){const p=c._p||map.latLngToXY(c[1],c[2]);if(mode==="world"){mode="saudi";window.geoShow&&geoShow(true);cityG.style("display",null).style("opacity",1);$("back").style.display="";$("chips").style.display="flex"}fly(p[0],p[1],Math.min(70,saudiK*3.4))}
$("back").onclick=world;

function draw(){

 const s=mk.selectAll("g.m").data(ok,d=>d.id);
 const e=s.enter().append("g").attr("class","m");
 e.append("circle").attr("class","pulse").attr("r",8);e.append("circle").attr("class","dot").attr("r",5.5);
 s.exit().remove();s.each(d=>d._p=map.latLngToXY(d.lat,d.lng));scale();$("n").textContent=(total!=null&&total>=ok.length)?total:ok.length;

function card(d,node){

 const c=$("card"),r=node.getBoundingClientRect();

async function startSupabase(){
 if(!window.supabase)await new Promise((ok,no)=>{const e=document.createElement("script");e.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js";e.onload=ok;e.onerror=()=>no(new Error("supabase-js failed to load"));document.head.appendChild(e)});
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 const norm=r=>({id:r.id,name:String(r.name||"").slice(0,40),msg:String(r.message||"").slice(0,200),place:String(r.place||"").slice(0,80),lat:+r.lat,lng:+r.lng});
 const load=async()=>{
  const [a,c]=await Promise.all([sb.from("national_messages").select("id,name,message,place,lat,lng,created_at").order("created_at",{ascending:false}).limit(500),sb.from("national_messages").select("id",{count:"exact",head:true})]);
  if(a.error)throw a.error;
  msgs=a.data.map(norm);total=c.error?null:c.count;draw();
 };
 await load();
 sb.channel("national_messages_live").on("postgres_changes",{event:"*",schema:"public",table:"national_messages"},p=>{
  if(p.eventType==="INSERT"){const m=norm(p.new);if(!msgs.some(x=>x.id===m.id)){msgs.push(m);if(total!=null)total++;draw()}}
  else load().catch(e=>console.error("supabase reload",e));
 }).subscribe();
 setInterval(()=>load().catch(e=>console.error("supabase poll",e)),60000);
}
async function startDb(){
 if(SUPABASE_URL&&SUPABASE_ANON_KEY){try{await startSupabase();return}catch(e){sb=null;console.error("Supabase connection failed",e);toast("تعذّر الاتصال بقاعدة البيانات السحابية.")}}
 try{
  db=await claude.use("db");
  if(db)db.collection("messages").limit(500).onSnapshot(sn=>{msgs=sn.docs.map(x=>{const v=x.data()||{};return{id:x.id,name:String(v.name||"").slice(0,40),msg:String(v.msg||"").slice(0,200),place:String(v.place||"").slice(0,60),lat:+v.lat,lng:+v.lng}}).filter(m=>m.name&&m.msg);draw()},()=>{});
 }catch(e){db=null}
}
function toast(t,ms){const e=$("toast");e.textContent=t;e.style.borderColor="";e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",ms||4500)}

/* ---------- form ---------- */
function nearest(a,b){let m=1e9,r="";CITIES.forEach(c=>{const d=(c[1]-a)**2+(c[2]-b)**2;if(d<m){m=d;r=c[0].split(" ")[0]}});return r}
function pv(){$("pp").textContent=loc?"📍 "+loc.place:"";$("cc").textContent=$("ms").value.length}
function mini(){
 const s=d3.select("#mini");s.selectAll("*").remove();
 const w=400,h=300,p=d3.geo.mercator().scale(1).translate([0,0]),pa=d3.geo.path().projection(p),b=pa.bounds(sau),sc=.92/Math.max((b[1][0]-b[0][0])/w,(b[1][1]-b[0][1])/h);
 p.scale(sc).translate([(w-sc*(b[1][0]+b[0][0]))/2,(h-sc*(b[1][1]+b[0][1]))/2]);pj=p;
 s.append("path").datum(sau).attr("d",d3.geo.path().projection(p)).attr("fill","#16803C").attr("stroke","#4ade80").attr("stroke-width",1);
 s.selectAll("circle.k").data(CITIES).enter().append("circle").attr("r",4).attr("fill","#f8d66d").attr("stroke","#101827").attr("cx",c=>p([c[2],c[1]])[0]).attr("cy",c=>p([c[2],c[1]])[1]).style("cursor","pointer").append("title").text(c=>c[0]);
 s.append("g").attr("id","pin");pin();
}
function miniTap(e){
 if(!pj||!sau){$("e3").textContent="\u062a\u0639\u0630\u0651\u0631 \u062a\u062d\u0645\u064a\u0644 \u062e\u0631\u064a\u0637\u0629 \u0627\u0644\u0645\u0645\u0644\u0643\u0629\u060c \u0627\u062e\u062a\u0631 \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629.";return}
 const sv=$("mini"),pt=sv.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(sv.getScreenCTM().inverse());
 let c0=null,cd=14;CITIES.forEach(c=>{const p=pj([c[2],c[1]]),d=Math.hypot(p[0]-q.x,p[1]-q.y);if(d<cd){cd=d;c0=c}});
 if(c0){setLoc(c0[1],c0[2],c0[0],c0[0]);return}
 const ll=pj.invert([q.x,q.y]);
 if(ll&&inSau(ll[0],ll[1]))setLoc(ll[1],ll[0],"\u0642\u0631\u0628 "+nearest(ll[1],ll[0]),"");
 else $("e3").textContent="\u0627\u0646\u0642\u0631 \u062f\u0627\u062e\u0644 \u062d\u062f\u0648\u062f \u0627\u0644\u0645\u0645\u0644\u0643\u0629 \u0639\u0644\u0649 \u0627\u0644\u062e\u0631\u064a\u0637\u0629.";
}
onTap($("mini"),miniTap,"\u0627\u0644\u062e\u0631\u064a\u0637\u0629 \u0627\u0644\u0645\u0635\u063a\u0651\u0631\u0629");
function pin(){const g=d3.select("#pin");if(!g.node())return;g.selectAll("*").remove();if(!loc||!pj)return;const q=pj([loc.lng,loc.lat]);g.append("circle").attr("cx",q[0]).attr("cy",q[1]).attr("r",8).attr("fill","#d4262c").attr("stroke","#fff").attr("stroke-width",2).style("pointer-events","none")}
function setLoc(a,b,place,sel){loc={lat:a,lng:b,place};$("pl").value=sel;$("e3").textContent="";pin();pv()}
$("pl").onchange=function(){const c=CITIES.find(x=>x[0]===this.value);if(c)setLoc(c[1],c[2],c[0],c[0]);else{loc=null;pin();pv()}};
["nm","ms"].forEach(i=>$(i).addEventListener("input",()=>{$("e1").textContent=$("e2").textContent="";pv()}));
function openForm(l){window.oa=Date.now();$("ov").style.display="block";try{mini()}catch(e){console.error("mini map failed",e)}if(l)setLoc(l.lat,l.lng,l.place,l.sel||"");pv();if(matchMedia("(pointer:fine)").matches)setTimeout(()=>{try{$("nm").focus({preventScroll:true})}catch(e){}},80)}
$("add").onclick=()=>{$("ov").style.display==="block"?closeForm(false):openForm()};
function closeForm(reset){$("ov").style.display="none";if(reset){$("nm").value="";$("ms").value="";$("pl").value="";$("fe").textContent="";$("e1").textContent=$("e2").textContent=$("e3").textContent="";loc=null;try{pin();pv()}catch(e){console.error(e)}}}
$("cl").onclick=()=>closeForm(false);
addEventListener("keydown",e=>{if(e.key==="Escape"&&$("ov").style.display==="block")closeForm(false)});
$("ov").addEventListener("mousedown",e=>{if(e.target===$("ov")&&Date.now()-(window.oa||0)>800)$("ov").style.display="none"});

$("go").onclick=async()=>{
 const name=$("nm").value.trim(),msg=$("ms").value.trim();let ok=true;
 $("e1").textContent=$("e2").textContent=$("e3").textContent="";
 if(name.length<2){$("e1").textContent="يرجى كتابة اسمك (حرفان على الأقل).";ok=false}
 if(!msg){$("e2").textContent="يرجى كتابة عبارتك الوطنية.";ok=false}
 else if(msg.length<5){$("e2").textContent="العبارة قصيرة جداً، اكتب 5 أحرف على الأقل.";ok=false}
 else if(msg.length>200){$("e2").textContent="العبارة تتجاوز 200 حرف.";ok=false}
 if(!loc||!inSA(loc.lat,loc.lng)){$("e3").textContent="اختر موقعاً داخل المملكة من القائمة أو بالنقر على الخريطة.";ok=false}
 if(!ok)return;
 if(Date.now()-lastPost<20000){toast("يرجى الانتظار قليلاً قبل نشر عبارة أخرى.");return}
 const rec={name:name.slice(0,40),msg,place:loc.place,lat:+loc.lat.toFixed(4),lng:+loc.lng.toFixed(4),t:Date.now()};
 $("go").disabled=true;$("go").textContent="جارٍ الحفظ…";$("fe").textContent="";let id=null;
 const lim=new Promise((_,no)=>setTimeout(()=>no(new Error("انتهت مهلة الاتصال")),15000));
 try{
  if(sb){const q=await Promise.race([sb.from("national_messages").insert({name:rec.name,message:rec.msg,place:rec.place,lat:rec.lat,lng:rec.lng}).select("id").single(),lim]);if(q.error)throw q.error;id=q.data.id;if(!msgs.some(x=>x.id===id)){msgs.push({id,...rec});if(total!=null)total++;draw()}}
  else if(db){const r=await Promise.race([db.collection("messages").add(rec),lim]);id=r.id}
  else throw new Error("الحفظ المشترك غير متاح حالياً (يلزم تسجيل الدخول أو إعداد قاعدة البيانات)");

  console.error("save failed",e);const c=e&&e.code;
  $("fe").textContent=(c==="permission_denied"||c==="not_granted"||c==="forbidden"?"ليس لديك صلاحية الحفظ في قاعدة البيانات المشتركة.":"تعذّر الحفظ: "+((e&&(e.message||e.code))||"خطأ غير معروف"))+" — بياناتك محفوظة في النموذج، حاول مرة أخرى.";
  $("go").disabled=false;$("go").textContent="انشر عبارتك على الخريطة";return;
 }
 /* saved for real: now close the form, reset it and show the result */
 lastPost=Date.now();closeForm(true);
 $("go").disabled=false;$("go").textContent="انشر عبارتك على الخريطة";
 toast("تمت إضافة عبارتك بنجاح",3200);
 try{
  if(mode==="world")enter();
  const p=map.latLngToXY(rec.lat,rec.lng);setTimeout(()=>fly(p[0],p[1],Math.min(70,saudiK*4)),mode==="saudi"?600:2500);
  setTimeout(()=>{const m=msgs.find(x=>x.id===id);if(m)card(m)},5200);
 }catch(e){console.error("post-save map animation",e)}
};
addEventListener("resize",()=>{W=innerWidth;H=innerHeight});
</script>
<script type="module">
/* Real open geodata: "saudi-national-address" (data CC0-1.0, code MIT): 13 region polygons + 4,581 cities with Arabic names. Loaded at runtime from jsDelivr (pinned version). If it cannot load, the page keeps its basic mode and says so. */
const B="https://cdn.jsdelivr.net/npm/saudi-national-address@1.1.0/";
let rg,rl,cg,cities=[],regs=[],shown=false,raf=0,vis=[];
const pairs=a=>Array.isArray(a)&&a.length>2&&a.every(p=>Array.isArray(p)&&p.length>=2&&typeof p[0]==="number");
const rings=(x,o=[])=>{if(pairs(x))o.push(x);else if(Array.isArray(x))x.forEach(y=>rings(y,o));return o};
const ll=p=>(p[0]>14&&p[0]<34&&p[1]>33)?[p[1],p[0]]:[p[0],p[1]];
const cxy=c=>{const k=c.center||c;if(Array.isArray(k))return ll(k);const a=k.lat??k.latitude,o=k.lng??k.lon??k.longitude;return typeof a==="number"&&typeof o==="number"?[o,a]:null};
const rn=n=>"منطقة "+String(n).replace(/^منطقة\s*/,"");
async function go(){
 try{
  const imp=async u=>{try{return await import(u)}catch(e){console.warn("geo import failed",u,e);return null}};
  const [F,L]=await Promise.all([imp(B+"full/+esm"),imp(B+"+esm")]);
  const pick=n=>{for(const m of [F,L])if(m&&(m[n]||(m.default&&m.default[n])))return m[n]||m.default[n]};
  const R=pick("regionsFull"),C=pick("cities")||[];
  if(!R||!R.length)throw new Error("regionsFull not found (full module loaded: "+!!F+", main module loaded: "+!!L+")");
  build(R,C);
 }catch(e){console.error("geo data failed",e)}
}
function build(R,C){
 const P=map.projection;
 regs=R.map(r=>{const rs=rings(r.boundaries||r.boundary||r.geometry||r.polygon).map(a=>a.map(ll));const c=cxy(r)||(rs[0]&&rs[0][0]);return{id:r.region_id,name:rn(r.name_ar||r.name_en),rings:rs,c}}).filter(r=>r.rings.length&&r.c);
 if(!regs.length)throw new Error("no region geometry");
 const nm={};regs.forEach(r=>nm[r.id]=r.name);
 rg=wrap.insert("g",()=>cityG.node()).style("display","none");
 rl=wrap.insert("g",()=>mk.node()).style("display","none");
 cg=wrap.insert("g",()=>mk.node()).style("display","none");
 regs.forEach(r=>{rg.append("path").attr("class","rg").attr("d",r.rings.map(a=>"M"+a.map(p=>P(p).join(",")).join("L")+"Z").join(""));r.p=P(r.c);
  rl.append("g").attr("class","l").datum(r).append("text").attr("class","rn").text(r.name)});
 const maj=new Set(CITIES.map(c=>c[0].split(" ")[0]));
 cities=C.map(c=>({id:c.city_id,n:c.name_ar||c.name_en,rid:c.region_id,xy:cxy(c)})).filter(c=>c.n&&c.xy&&inSA(c.xy[1],c.xy[0]));
 cities.forEach(c=>{c.p=P(c.xy);c.pr=maj.has(c.n)?0:1;c.reg=nm[c.rid]||""});
 cities.sort((a,b)=>a.pr-b.pr||a.id-b.id);
 if(cities.length)cityG.classed("geo",true);
 shown=(mode==="saudi");apply();
}
function apply(){if(!rg)return;[rg,rl,cg].forEach(g=>g.style("display",shown?null:"none"));lab();cityRender()}
function lab(){
 if(!rg)return;
 rl.selectAll("g.l").attr("transform",d=>"translate("+d.p+")scale("+1/K+")");
 rl.style("display",shown&&K<saudiK*3.4?null:"none");
 cg.selectAll("g.g").attr("transform",d=>"translate("+d.p+")scale("+1/K+")");
}
function cityRender(){
 if(!rg)return;
 if(!shown||K<saudiK*1.5){cg.selectAll("*").remove();vis=[];return}
 const maxPr=K>=saudiK*3.2?1:0,cell=64/K,x0=-T[0]/K,x1=(W-T[0])/K,y0=-T[1]/K,y1=(H-T[1])/K,used=new Set(),out=[];
 for(const c of cities){if(c.pr>maxPr)break;const x=c.p[0],y=c.p[1];if(x<x0||x>x1||y<y0||y>y1)continue;const k=Math.floor(x/cell)+"_"+Math.floor(y/cell);if(used.has(k))continue;used.add(k);out.push(c);if(out.length>=140)break}
 vis=out;
 const s=cg.selectAll("g.g").data(out,d=>d.id),e=s.enter().append("g").attr("class","g");
 e.append("circle").attr("r",3.2);e.append("text").attr("x",6).attr("y",4).text(d=>d.n);
 s.exit().remove();
 cg.selectAll("g.g").attr("transform",d=>"translate("+d.p+")scale("+1/K+")");
 cg.selectAll("g.g text").style("display",d=>(d.pr===0||K>=saudiK*5)?null:"none");
}
window.geoShow=v=>{shown=v;apply()};
window.geoScale=()=>{if(!rg)return;lab();if(!raf)raf=requestAnimationFrame(()=>{raf=0;cityRender()})};
window.geoHit=(px,py)=>{let b=null,bd=20;vis.forEach(c=>{const d=Math.hypot(c.p[0]*K+T[0]-px,c.p[1]*K+T[1]-py);if(d<bd){bd=d;b=c}});return b?{lat:b.xy[1],lng:b.xy[0],place:(b.reg?b.reg+" · ":"")+b.n}:null};
window.geoRegion=(x,y)=>{const r=regs.find(r=>r.rings.some(a=>inRing(a,x,y)));return r?r.name+" · ":""};
if(window.mapReady)go();else addEventListener("mapready",go,{once:true});
</script>
